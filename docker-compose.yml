version: '3'

services:
  mongo-db:
    image: bitnami/mongodb
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USER: test
      MONGO_INITDB_ROOT_PASSWORD: test*
      MONGO_INITDB_DATABASE: testdb
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
